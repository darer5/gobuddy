# dsh-weread-sidebar bundle patch
#
# 本文件是 dsh.bundle.patch 声明的补丁层：当插件出现在 web profile 的
# dsh.profile.bundles 列表里时，profile 启动会把下面这一行 loader 条目插入
# 插件树（与 dsh-better-sidebar 的 cordis.patch.yml 完全相同的机制）。
#
# 参考 dsh-better-sidebar 的注释：通过官方 CLI 安装时（
#   dsh plugin --profile web add dsh-weread-sidebar@<version>
# ）会把它追加到 bundle 栈并自动挂载；手动安装时把包放进 profile 的
# node_modules 并把它追加到 profile package.json 的 dsh.profile.bundles 即可。
- insert:
    - id: weread-sidebar
      name: 'dsh-weread-sidebar'
